services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    working_dir: /workspace/online-testing-app
    volumes:
      - .:/workspace/online-testing-app
      - database_store:/var/lib/online-testing-app
    environment:
      APP_DATA_DIR: /var/lib/online-testing-app
    ports:
      - "5050:5050"
    command: sleep infinity

volumes:
  database_store:
